name: Deploy to VPS

on:
  push:
    branches:
      - main # Jalankan otomatis setiap kali ada push ke branch main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy to VPS Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # password: ${{ secrets.VPS_PASSWORD }} # Gunakan ini jika server Anda login pakai password, bukan SSH Key
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /path/to/your/sso-server # GANTI DENGAN PATH FOLDER PROJECT DI VPS
            
            # Matikan aplikasi sejenak
            php artisan down
            
            # Tarik kode terbaru dari GitHub
            git pull origin main
            
            # Install dependensi (kalau ada update package)
            composer install --no-interaction --prefer-dist --optimize-autoloader
            
            # Update database
            php artisan migrate --force
            
            # Sinkronisasi data dari SIM
            php artisan sync:users-from-sim
            
            # Bersihkan cache
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            
            # Nyalakan aplikasi
            php artisan up
