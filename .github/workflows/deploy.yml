name: Deploy to VPS

on:
  push:
    branches:
      - main 

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy to VPS Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          # key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }} # Gunakan ini karena server Anda login pakai password
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e # Hentikan script jika ada error
            
            # GANTI 'sso.domainanda.com' dengan nama folder website Anda di aaPanel
            cd /www/wwwroot/puskomnh.com 
            
            # Matikan aplikasi sejenak (jangan hentikan script jika gagal karena error syntax sebelumnya)
            php artisan down || true
            
            # Tarik kode terbaru dari GitHub
            git pull origin main
            
            # Karena aaPanel menggunakan user 'www' untuk web, kembalikan hak akses ke 'www'
            # (Penting agar tidak terjadi error Permission Denied di website)
            chown -R www:www ./
            
            # Install dependensi (kalau ada update package)
            # Anda bisa ganti 'php' dengan versi spesifik jika perlu, misal: /www/server/php/82/bin/php
            composer install --no-interaction --prefer-dist --optimize-autoloader
            
            # Update database
            php artisan migrate --force
            
            # Sinkronisasi data dari SIM
            php artisan sync:users-from-sim
            
            # Bersihkan cache
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            
            # Nyalakan aplikasi
            php artisan up
